# Continuous Integration -- wqm-0.2 rebuild workspace (src/rust).
#
# Grow-per-phase (PRD F-00): this workflow targets `cargo build/test --workspace`
# against the currently-declared member set, so it stays green at every merge as
# crates are added phase by phase. Platform toolchain deps (protobuf for wqm-proto
# codegen, ONNX Runtime for wqm-embed-native) are added to the relevant jobs when
# those crates land -- Phase 0 needs none.
name: CI

on:
  push:
    paths:
      - "src/rust/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/rust/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: src/rust
        run: cargo fmt --all -- --check

  build-test:
    name: build + test + clippy (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # `wqm-proto` generates its Rust from `.proto` at BUILD time (N24 is the
      # single producer, so nothing generated is committed). That makes protoc a
      # build-time toolchain dependency from P04-GT001-WO011 onward -- on both
      # runners, since the matrix builds macOS too.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Clippy (warnings are errors)
        working-directory: src/rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        working-directory: src/rust
        run: cargo build --workspace
      # The walking-skeleton slice, run as a SLICE. CHARTER §2.6 (axis F) is that
      # `ci.yml` already ran the right commands and this axis makes it a *gate*:
      # a slice that breaks must be identifiable as the slice breaking, not as one
      # of ~100 tests in a wall of output. Both halves drive the real binaries as
      # subprocesses -- `status` across the daemon seam (WO011), `query` through
      # the planner/executor/read-leg path (WO013).
      - name: The walking-skeleton slice
        working-directory: src/rust
        env:
          WQM_TEST_SKIP_LOG: ${{ runner.temp }}/wqm-skips.log
        run: |
          cargo test -p workspace-qdrant-mcp --test status_round_trip --test query_round_trip
      - name: Test
        working-directory: src/rust
        env:
          # The seam the skip-set gate stands on. The harness appends every
          # `WQM-TEST-SKIP` announcement here; the next step compares the SET
          # against `ci/skip-policy.toml`.
          WQM_TEST_SKIP_LOG: ${{ runner.temp }}/wqm-skips.log
        run: cargo test --workspace
      # CR-007 defect (b)'s recovery floor. The structural half -- a skip cannot be
      # dropped silently, because `SkipReason` is `#[must_use]` under a
      # warnings-denied workspace -- lives in the harness. This is the other half:
      # gating on the SET, so a suite drifting into asserting nothing while staying
      # green fails here.
      #
      # Deliberately NOT `if: always()`. On a run whose build or tests already
      # failed there is no log, and the gate's positive-control branch would report
      # "the sink is broken" on top of a failure that has nothing to do with the
      # sink -- a second, misleading red beside a real one. The condition this gate
      # exists for is a run that would otherwise be GREEN, and that is exactly when
      # this step is reached.
      - name: Gate the announced skip set
        working-directory: src/rust
        run: |
          python3 ci/gate_skips.py \
            --log "${{ runner.temp }}/wqm-skips.log" \
            --runner "${{ matrix.os }}"

  guards:
    # Codesize used to run here as its own non-gating "report" job. It is now
    # `guard_codesize.py` inside run_guards.sh -- gating, and measuring the
    # function limit the old report never looked at (P04-GT001-WO006).
    name: CI guards (link-closure, stratification, codesize, registries, tests)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run guards
        working-directory: src/rust
        run: bash ci/run_guards.sh

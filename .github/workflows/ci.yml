# Continuous Integration -- wqm-0.2 rebuild workspace (src/rust).
#
# Grow-per-phase (PRD F-00): this workflow targets `cargo build/test --workspace`
# against the currently-declared member set, so it stays green at every merge as
# crates are added phase by phase. Platform toolchain deps (protobuf for wqm-proto
# codegen, ONNX Runtime for wqm-embed-native) are added to the relevant jobs when
# those crates land -- Phase 0 needs none.
name: CI

on:
  push:
    paths:
      - "src/rust/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/rust/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: src/rust
        run: cargo fmt --all -- --check

  build-test:
    name: build + test + clippy (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Clippy (warnings are errors)
        working-directory: src/rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        working-directory: src/rust
        run: cargo build --workspace
      - name: Test
        working-directory: src/rust
        run: cargo test --workspace

  guards:
    name: CI guards (link-closure, registries, tests)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run guards
        working-directory: src/rust
        run: bash ci/run_guards.sh

  codesize:
    name: codesize report (non-gating)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tokei
        run: cargo install tokei --locked || true
      - name: Report
        working-directory: src/rust
        run: bash ci/codesize.sh

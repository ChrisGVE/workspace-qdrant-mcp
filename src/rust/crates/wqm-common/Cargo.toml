# wqm-common -- the infra floor (ARCH §9.1): N8 names, N9 errors, N23 path-canon,
# N35 profiles + field-family registry, N51 access-capability registry, N7 config,
# N3 identity value objects + fts_key, N40 types, N12 envelope types, the N44 port
# trait, the DisambiguationStrategy port + RulesWriteCap type, the Secret type.
# No wqm-crate dependencies -- this is the bottom of the DAG. Contents grow per
# work order; P04-GT001 declares the crate and seeds N8, and each later nexus
# arrives with the slice that realizes it (see mesh/program.db).
[package]
name = "wqm-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# N12's envelope is a JSON object with a sealed key set (MCP-SURFACE.md §3.1), so
# it is serialized by serde rather than formatted by hand -- the shape is enforced
# by the types, and the wire spelling by the attributes.
serde = { workspace = true }
serde_json = { workspace = true }

# The `Secret` newtype wraps `Zeroizing<Vec<u8>>` so a resolved credential's bytes
# are wiped when the value drops (P04-GT002-WO075, A-secret invariants).
zeroize = { workspace = true }

# wqm-0.2 workspace root (rebuild). Members are globbed, so each work order adds
# its own crate directory and `cargo build --workspace` stays green against the
# currently-declared set.
#
# ARCH rev15 §9.1 is the authoritative crate map: 18 library-crate rows, in table
# order -- wqm-common, wqm-conventions, wqm-sensor, wqm-proto, wqm-store,
# wqm-store-write, wqm-search, wqm-embed-native, wqm-ingest, wqm-intel, wqm-lsp,
# wqm-graph, wqm-facade, wqm-secrets, wqm-host, wqm-service-install, wqm-client,
# wqm-serve -- plus FOUR bins: memexd (S1), workspace-qdrant-mcp (S2), wqm
# (S3+S4), and wqm-restore, the offline maintenance binary added at rev11.
# A possible 19th crate is deliberately undecided: §9.1 note 3 leaves N13/N31 in
# wqm-common "or a small wqm-obs crate (P02 call)". They arrive slice by slice;
# the tracker is mesh/program.db.
#
# The prior comment here cited "ARCH rev08 ... 16 libs + 3 bins", which predates
# rev11's wqm-conventions/wqm-sensor/wqm-lsp, ARCH-01's wqm-service-install split,
# and the wqm-restore bin (P04-GT001-WO001, drift D1).
#
# Every "ARCH rev14" citation in this workspace was corrected to rev15 at
# P04-GT001-WO006 (drift D7): the architecture's frontmatter reads `revision: 15`,
# extracted rather than recalled. Substance is unaffected -- r15 is a three-clause
# micro-pass in §2 AGP-4, §8.1, and a mesh-verdicts currency note, and no section
# this workspace cites is among them (verified: the body carries no rev15 marker).
# The stale number came from restating rev14 instead of extracting it, the same
# error class §7.3a's restatement rule exists to catch.
[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.79"
license = "Apache-2.0"
repository = "https://github.com/ChrisGVE/workspace-qdrant-mcp"

# Shared dependency versions. Crates opt in via `dep.workspace = true`.
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "1"

# Async runtime. Arrives at P04-GT001-WO007 for the test harness; the slice needs it
# too (the S2 bin crosses N49 -> N24 gRPC -> N48's serve loop, all async). Features
# are chosen per crate rather than enabled wholesale here.
tokio = { version = "1", default-features = false }

# Warnings are errors across the workspace (project mandate: fix root cause, never
# silence). Applied here so local builds and CI agree; CI additionally runs
# `clippy -- -D warnings` and `rustfmt --check`.
[workspace.lints.rust]
warnings = "deny"

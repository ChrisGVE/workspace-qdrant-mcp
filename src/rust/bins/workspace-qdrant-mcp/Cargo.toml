# workspace-qdrant-mcp -- the S2 MCP server binary (ARCH rev15 §9.1). It exposes
# the eight-tool agent surface sealed by P01-GT004 (MCP-SURFACE.md §1.2) over
# stdio. Reads are served IN-PROCESS through N49, which embeds the kernel read
# subset directly over wqm-store -- a client links NO facade (decision B, §9.1);
# writes are proxied. P04-GT001 ships a minimal-but-real binary: arg parsing,
# version, and a typed not-yet-available decline, plus the walking-skeleton
# slice. The N43 adapter and the N33 rules-injection half arrive with N43's
# slice, P04-GT061.
[package]
name = "workspace-qdrant-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Package `workspace-qdrant-mcp` (ARCH rev15 §9.1); filename carries the `-v2`
# suffix so it never overwrites production's MCP server -- and so the parallel-period
# MCP registration names a distinct executable. See bins/memexd/Cargo.toml for the
# rationale, ci/guard_bin_suffix.py for the gate (P04-GT001-WO010).
[[bin]]
name = "workspace-qdrant-mcp-v2"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
# A client bin's whole declared closure: the client seam and the shared floor
# (ARCH rev15 §9.1, the three client-bin closures). No serving crate, no
# s1_only crate -- guard_link_closure.py enforces that from the other side.
wqm-client = { path = "../../crates/wqm-client" }
wqm-common = { path = "../../crates/wqm-common" }
wqm-proto = { path = "../../crates/wqm-proto" }
# The read pipeline, embedded in-process (ARCH rev15 §9.1 decision B): the planner
# and executor, and N41's read leg under them. No facade -- `wqm-facade` is
# S1-only and guard_link_closure.py enforces that from the other side.
wqm-search = { path = "../../crates/wqm-search" }
wqm-store = { path = "../../crates/wqm-store" }
tokio = { workspace = true, features = ["rt", "macros"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The round-trip test drives the real binaries as subprocesses, so it needs no
# server crate -- only the harness's skip vocabulary, so that "the daemon binary
# is not built" is an ANNOUNCED skip and never a silent pass (CR-007 defect 2).
wqm-test-harness = { path = "../../crates/wqm-test-harness" }

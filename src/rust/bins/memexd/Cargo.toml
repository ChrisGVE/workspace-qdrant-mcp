# memexd -- the S1 daemon binary (ARCH §9.1). It is the sole writer of persistent
# state and serves N50 over gRPC via N48. Phase 0 ships a minimal-but-real binary:
# it parses args, reports its version, and declines to run with a typed
# not-yet-available exit. The serve loop, host runtime, and kernel wiring arrive
# across Phases 0-7 as their crates land.
[package]
name = "memexd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The PACKAGE is `memexd` (ARCH rev15 §9.1's row); the physical FILENAME carries
# the `-v2` deployment suffix, because installing a bare `memexd` would overwrite
# production's. Binaries are the knob's declared exception (CHARTER §2.4): a
# manifest is data, so this cannot be built by `concat!` -- cutover is a one-token
# edit here, gated by ci/guard_bin_suffix.py (P04-GT001-WO010).
[[bin]]
name = "memexd-v2"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }

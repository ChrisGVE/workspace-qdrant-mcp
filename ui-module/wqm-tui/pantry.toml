[config]
theme = "dark"
style_source = "wqm_tui::tokens"

# Storyboard layers (VISUAL-LANGUAGE §6). Cycle with `b` to check a widget against the surface
# it will actually sit on, so a widget preview sits on the same colour a screen does — the old
# #000000 / #262626 / #3B3B3B were absolute values that matched no theme and made the fill-less
# toast look filled (§8.6).
#
# ⚠ These are **Catppuccin Mocha** values (re-read 20260906, when the harness moved off
# Everforest so that the screen Chris judges and the numbers the tests pin are the same theme).
# They are `screen_bg()`, `layer1_bg()` and `layer2_bg()` under that theme, in that order.
#
# This is the one transcription left in this file and it is pinned to that choice: change the
# theme in `examples/widget_preview/main.rs` and these three are wrong until they are re-read.
# Nothing will fail — which is exactly why `[colors.*]` is gone.
[pantry.preview_backgrounds]
layer0 = "#1E1E2E"
layer1 = "#3D3E51"
layer2 = "#4D5064"

# The Styles tab's vocabulary is NOT here any more (Chris, 20260801: *"you can get rid of Role /
# Reserved / Anchor / Structure — under the Colors style we only need this one"*). Every one of
# those groups was a hand-transcription of `tokens` pinned to one theme, and `Colors/Palette`
# renders the same vocabulary live from whichever theme is in force. Two of them had already
# drifted. What is left in this file is what static TOML can honestly own: which theme the
# harness paints with, and what its own preview backgrounds are.

[ingredients]
source = "wqm_tui"
modules = [
    # The screen chrome (§16). Atomic elements like any other widget — they were unbrowsable
    # while they lived inside `views::chrome`, which is the one thing a design instrument
    # must never make of an element it renders.
    "widgets::chrome::app_bar",
    "widgets::chrome::pane_selector",
    "widgets::chrome::rule",
    "widgets::chrome::status_line",
    "widgets::chrome::title_bar",
    "widgets::chrome::zone_heading",
    "widgets::config_table",
    "widgets::daemon_status",
    "widgets::envelope",
    "widgets::modal",
    "widgets::store_health",
    "widgets::surface",
    "widgets::tab_bar",
    "widgets::toast",
    # The Panes tab: zones of a screen (§16). Panes are the unit of design work from here —
    # the Dashboard is a 2 × 3 grid of them, each judged alone before being composed.
    "panes::cell",
    "panes::collections",
    "panes::config",
    # The full-width list: one table filling a tab's body, and the shape every list tab takes.
    "panes::list",
    "panes::status_band",
    "panes::status_block",
    "panes::storage",
    # The Styles tab: the vocabulary, rendered live rather than transcribed. These two ask
    # `tokens` the same questions a screen asks, so they cannot drift from it — which is what
    # the `[colors.*]` tables above, being static TOML, always could.
    "styles::categorical",
    "styles::palette",
    "styles::palette_reference",
    "styles::theme_sheet",
    "styles::typography",
    # The Views tab: full-page layouts. A view composes the widgets above and the screen
    # chrome — it never renders anything of its own.
    "views::dashboard",
    "views::queue",
    "views::service",
    "views::shell",
]

[config]
theme = "dark"
style_source = "wqm_tui::tokens"

# Storyboard layers (VISUAL-LANGUAGE §6). Cycle with `b` to check a widget against the
# surface it will actually sit on. These are the CatppuccinMocha values the pantry paints
# with, so a widget preview sits on the same colour a screen does — the old #000000 /
# #262626 / #3B3B3B were absolute values that matched no theme and made the fill-less toast
# look filled (§8.6).
[pantry.preview_backgrounds]
layer0 = "#1E1E2E"
layer1 = "#3D3E51"
layer2 = "#4D5064"

# ─────────────────────────────────────────────────────────────────────────────────────────
# This file is STATIC TOML and cannot call our code, so every value below is a transcription
# and every transcription is a claim. They are all measured from `tokens` under
# `Palette::Bundled` with `ratatui_themes` CatppuccinMocha — which is what ships, so the
# vocabulary and the renderer now agree by construction rather than by coincidence.
# **Pinned to one theme**: switch the theme and this tab is wrong until it is retranscribed.
#
# The live instrument is `Palette Reference`, which renders through `tokens` and therefore
# cannot drift. This tab is the vocabulary, not the truth.
# ─────────────────────────────────────────────────────────────────────────────────────────

# The theme's six hues, under the names the theme itself gives them (§15). Four of them carry
# one of our roles each; see `[colors.reserved]` below for the mapping and for why `secondary`
# and `accent` carry none.
[colors.role]
accent = "#89B4FA"
secondary = "#F5C2E7"
error = "#F38BA8"
warning = "#F9E2AF"
success = "#A6E3A1"
info = "#94E2D5"

# The four RESERVED hues under our own names — the vocabulary the design actually speaks. §4 asks
# for *offline*, never for red, and until this group existed the Styles tab could only be read
# by someone who already knew the mapping. `Palette::Bundled` is where it stops being a
# mapping on paper: `offline()` returns the theme's `error`, so these are transcriptions of
# what renders rather than of an intention.
#
# `selector` is `info` and not `accent` — §15 left that field to us, and `info` keeps roughly
# twice `accent`'s worst-case distance from the three health hues across the fifteen bundled
# themes (ΔE 27.9 against 14.7). §3 reserves the selector absolutely, so it is defended at its
# worst case. The measurement is
# `tokens::tests::the_selector_is_info_because_it_keeps_the_most_distance_from_the_health_hues`.
[colors.reserved]
healthy = "#A6E3A1"
degraded = "#F9E2AF"
offline = "#F38BA8"
selector = "#94E2D5"

# The theme's four neutral ANCHORS, in ladder order: background, the interior anchor nearest
# it, the text anchor, and the foreground. Measured across all fifteen themes, `selection`
# and `muted` always sit strictly inside `[bg, fg]` in that order — which is what makes the
# eleven-rung ladder interpolable from four named colours
# (`theme_sheet::every_theme_gives_ten_distinct_roles_and_four_ordered_neutrals`).
[colors.anchor]
bg = "#1E1E2E"
selection = "#313244"
muted = "#6C7086"
fg = "#CDD6F4"

# The emphasis ladder is NOT here. It moved to `styles::typography` (§17.1): Chris asked for
# the four rungs at three weights, and a `[typography]` entry takes a colour and a description
# and nothing else — the format has no field for weight. Rendering it from `tokens` also ended
# the transcription, which was four hex values measured under one theme and pinned to it.

# The structural greys and the fills, same source. These are the rungs r02 specifies that
# are neither text nor hue, and the reason four named neutrals are not enough on their own.
[colors.structure]
rule_frame = "#8D93AC"
rule_internal = "#5C5F74"
header = "#9EA4BE"
cursor_bg = "#45475A"
edit_bg = "#666A80"
layer1_bg = "#3D3E51"
layer2_bg = "#4D5064"

[ingredients]
source = "wqm_tui"
modules = [
    # The screen chrome (§16). Atomic elements like any other widget — they were unbrowsable
    # while they lived inside `views::chrome`, which is the one thing a design instrument
    # must never make of an element it renders.
    "widgets::chrome::pane_selector",
    "widgets::chrome::rule",
    "widgets::chrome::status_line",
    "widgets::chrome::title_bar",
    "widgets::chrome::zone_heading",
    "widgets::collections",
    "widgets::config_table",
    "widgets::daemon_status",
    "widgets::envelope",
    "widgets::modal",
    "widgets::palette_reference",
    "widgets::store_health",
    "widgets::surface",
    "widgets::tab_bar",
    "widgets::theme_sheet",
    "widgets::toast",
    # The Styles tab: the vocabulary, rendered live rather than transcribed. These two ask
    # `tokens` the same questions a screen asks, so they cannot drift from it — which is what
    # the `[colors.*]` tables above, being static TOML, always could.
    "styles::palette",
    "styles::typography",
    # The Views tab: full-page layouts. A view composes the widgets above and the screen
    # chrome — it never renders anything of its own.
    "views::service",
]

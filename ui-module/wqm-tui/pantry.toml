[config]
theme = "dark"
style_source = "wqm_tui::tokens"

# Storyboard layers (VISUAL-LANGUAGE §6). Cycle with `b` to check a widget against the
# surface it will actually sit on. These are the CatppuccinMocha values the pantry paints
# with, so a widget preview sits on the same colour a screen does — the old #000000 /
# #262626 / #3B3B3B were absolute values that matched no theme and made the fill-less toast
# look filled (§8.6).
[pantry.preview_backgrounds]
layer0 = "#1E1E2E"
layer1 = "#3D3E51"
layer2 = "#4D5064"

# ─────────────────────────────────────────────────────────────────────────────────────────
# This file is STATIC TOML and cannot call our code, so every value below is a transcription
# and every transcription is a claim. They are all measured from `ratatui_themes`
# CatppuccinMocha and from `tokens` under `Palette::Derived` with Mocha's endpoints — the
# combination the whole crate has been measured against. **Pinned to one theme by
# construction**: switch the theme and this tab is wrong until it is retranscribed.
#
# The live instruments are `Palette Sheet` and `Palette Reference`, which render through
# `tokens` and therefore cannot drift. This tab is the vocabulary, not the truth.
# ─────────────────────────────────────────────────────────────────────────────────────────

# The theme's six hues, under the names the theme itself gives them (§15). Our roles map
# onto these one-for-one: healthy→success, degraded→warning, offline→error, and the
# reserved selector→accent (or info — the one UI call §15 left open).
[colors.role]
accent = "#89B4FA"
secondary = "#F5C2E7"
error = "#F38BA8"
warning = "#F9E2AF"
success = "#A6E3A1"
info = "#94E2D5"

# The theme's four neutral ANCHORS, in ladder order: background, the interior anchor nearest
# it, the text anchor, and the foreground. Measured across all fifteen themes, `selection`
# and `muted` always sit strictly inside `[bg, fg]` in that order — which is what makes the
# eleven-rung ladder interpolable from four named colours
# (`theme_sheet::every_theme_gives_ten_distinct_roles_and_four_ordered_neutrals`).
[colors.anchor]
bg = "#1E1E2E"
selection = "#313244"
muted = "#6C7086"
fg = "#CDD6F4"

# The emphasis ladder, INTERPOLATED FROM THE THEME'S OWN fg AND bg rather than from white
# (Chris, 20260731) — a ladder anchored on white is a grey ladder, and it stays grey on a
# theme whose foreground is not. Mocha's fg is blue-tinted and so is every rung here.
#
# ⚠ Weight is the other half of this axis and the Styles tab cannot show it: a typography
# entry takes a colour and a description, nothing else. `strong` is bold, which is most of
# what separates it from `normal` — so read the descriptions, and judge the real thing in
# `Palette Sheet`.
[typography]
strong = { color = "#ECF6FF", description = "bold, and extrapolated PAST the foreground — the one datum that must be seen" }
normal = { color = "#CDD6F4", description = "the theme's own fg: body text of the focused zone, the baseline" }
muted = { color = "#9EA4BE", description = "inactive tabs, unfocused bodies, timestamps, key hints" }
faint = { color = "#858AA2", description = "de-emphasised metadata that must still be legible: DEFAULT values, secondary counts" }

# The structural greys and the fills, same source. These are the rungs r02 specifies that
# are neither text nor hue, and the reason four named neutrals are not enough on their own.
[colors.structure]
rule_frame = "#8D93AC"
rule_internal = "#5C5F74"
header = "#9EA4BE"
cursor_bg = "#45475A"
edit_bg = "#666A80"
layer1_bg = "#3D3E51"
layer2_bg = "#4D5064"

[ingredients]
source = "wqm_tui"
modules = [
    # The screen chrome (§16). Atomic elements like any other widget — they were unbrowsable
    # while they lived inside `views::chrome`, which is the one thing a design instrument
    # must never make of an element it renders.
    "widgets::chrome::pane_selector",
    "widgets::chrome::rule",
    "widgets::chrome::status_line",
    "widgets::chrome::title_bar",
    "widgets::chrome::zone_heading",
    "widgets::collections",
    "widgets::config_table",
    "widgets::daemon_status",
    "widgets::envelope",
    "widgets::modal",
    "widgets::palette_reference",
    "widgets::palette_sheet",
    "widgets::store_health",
    "widgets::surface",
    "widgets::tab_bar",
    "widgets::theme_sheet",
    "widgets::toast",
    # The Views tab: full-page layouts. A view composes the widgets above and the screen
    # chrome — it never renders anything of its own.
    "views::service",
]

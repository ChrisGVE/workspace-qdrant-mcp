[package]
name = "wqm-tui"
version.workspace = true
edition.workspace = true

[dependencies]
ratatui = { workspace = true }
libc = { workspace = true }
tui-pantry = { version = "0.4.0", optional = true }

# The Encoding axis (`src/encoding.rs`): what the output stream can actually emit. Detection
# only — the crate's `adapt_color` quantisation is deliberately NOT used, see the module docs.
# No features are enabled, and every one of this crate's own dependencies is optional, so it
# costs nothing transitively. MSRV 1.88.0, which is exactly `src/rust`'s `rust-version`.
termprofile = "0.2.4"

# Headless pixel capture (`src/capture.rs`), optional so the shipping crate carries neither.
# `soft_ratatui` is a pure-software ratatui backend — no GPU, no terminal, no window server
# and no OS permission — which is what makes a PNG of a frame producible from an agent.
soft_ratatui = { version = "0.2.0", optional = true }
png = { version = "0.17", optional = true }

# The bundled-theme SOURCE, adopted by §15 (Chris, 20260731) — no longer an instrument, and
# therefore no longer optional. It ships: a bundled theme is where every colour on the screen
# comes from once `Palette::Bundled` lands, so a build without it has no palette to paint.
#
# Cheap to carry: `default-features = false` drops its only optional dependency (serde), which
# leaves ratatui — a dependency we already have — as its entire tree. MSRV 1.74.
#
# The `themes-preview` feature still exists and still gates `widgets/theme_sheet.rs`: that is
# the EVALUATION instrument (the base16 comparison, the fifteen-theme gallery), which produced
# the §15 decision and is not part of the surface.
#
# `ratatui-themes` is the SEMANTIC representation — ten non-optional fields per theme, and
# its `Color` really is `ratatui::style::Color` because it tracks ratatui ^0.30 like we do.
# (`ratatui-base16` exposes the raw slots but pins ^0.29, whose Color is a DIFFERENT type —
# which is why the base16 half of the comparison is data in `src/themes.rs` rather than a
# dependency. That is also the shipping route: MIT YAML, our own table.)
ratatui-themes = { version = "0.2.0", default-features = false }

# The EXTENDED palette tier (`src/categorical.rs`), adopted 20260906. `ratatui-themes` names
# ten semantic ROLES and that is the whole UI vocabulary; this is the other question — a set of
# mutually distinguishable hues for **data** (graph nodes, tags, cell kinds), where the meaning
# is "these are different from each other" and nothing more.
#
# Not optional, and the reason is the fallback: a theme that is not a Catppuccin flavour still
# has to compile and still has to answer `len()`. Gating the crate would mean gating the
# detection, and then a non-Catppuccin build would take a different code path than the one the
# tests exercise. The data is a few hundred constants; there is nothing to save.
#
# The `ratatui` feature pulls `ratatui-core ^0.1`, which is exactly what `ratatui 0.30.2`
# depends on, so cargo unifies them and `catppuccin::Color` converts straight into the
# `ratatui::style::Color` we already use — no hand-written bridge.
#
# **Hard-pinned.** The palette values are generated from upstream at build time; a minor bump
# that retuned one accent would silently reorder `Categorical` and move every colour a future
# graph view had assigned to a node. That is a change worth taking deliberately.
catppuccin = { version = "=2.8.0", features = ["ratatui"] }

# The editor engine under every text input (`src/editor/`), adopted 2026-09-13 21:57 (Chris:
# "Yes A, go ahead and adopt it") on the evidence of `PASS2-EVAL.md` §E-2. Ruling B made the
# editor an operator grammar — `d`/`c`/`y` over any motion or text object, counts on both,
# `t`/`T`/`f`/`F` with `;`/`,`, counts composing inside visual (`v2t,`) — and this is the one
# candidate that passes it today, with 637 assertions on its own vim table that we do not have
# to invent. ONE engine, TWO keymaps: the vim table as shipped, and a conventional table derived
# from its modeless one — that is how "you'll need two anyways" is served without two crates.
#
# The engine consumes `Action`s and knows nothing about keys or ratatui; `modalkit-ratatui` is
# the adapter that renders a `TextBoxState` into a `Buffer` with no terminal, which is the shape
# of every test in this crate. The §3 caret (`▏` in insert, reversed block in normal) stays
# OURS as a render wrapper on top, reading the mode from the binding machine.
#
# Cost, measured 2026-09-13 at adoption with
# `cargo tree -e normal --all-features --prefix none | awk '{print $1}' | sort -u | wc -l`:
# 151 → 197 unique crates (+46; §E-2's probe counted +25 against a different baseline, and
# this figure is the one to re-measure rather than quote). `crossterm 0.29` was already in-tree
# via `ratatui-crossterm`, so no new input backend enters. MSRV 1.88, exactly our floor.
#
# **Hard-pinned.** A 0.0.x API that moved between 0.0.25 and 0.0.27; the §E-2 probe, now
# `src/editor/acceptance.rs`, is the test any bump has to pass before it is taken.
modalkit = "=0.0.27"
modalkit-ratatui = "=0.0.27"

# The real contracts, inherited from the ui-module workspace so this crate and its future
# sibling `wqm-cli` cannot drift onto different versions of them. Binding these means the
# storyboard renders the system's own types rather than mock-ups: a frame that depicts a
# state the contract cannot express will not compile, and a contract that grows a new
# state breaks the frames that ignore it.
#
# N8 names + N12 the response envelope.
wqm-common = { workspace = true }
# N49 the client seam: DaemonReport, whose Unreachable variant is UX-F021 in type form.
wqm-client = { workspace = true }
# N24 the wire contract, for `Address` — what the TUI shows when it says where it looked.
wqm-proto = { workspace = true }

# The closed N12 vocabularies spell themselves through serde (snake_case rename), so the
# storyboard reads the wire spelling out of the type rather than re-typing it.
serde = { workspace = true }
serde_json = { workspace = true }

[features]
tui-pantry = ["dep:tui-pantry"]
png-capture = ["dep:soft_ratatui", "dep:png"]
themes-preview = []

# The pantry entry point cannot build without the feature that provides `tui_pantry`.
# Declaring that here is what lets a bare `cargo test` succeed: without it cargo tries to
# compile the example unconditionally and fails on an unresolved crate, so the crate had no
# runnable test command that did not also need `--features tui-pantry`.
[[example]]
name = "widget_preview"
path = "examples/widget_preview/main.rs"
required-features = ["tui-pantry"]

# Same reason as above: the capture path cannot compile without the backend that provides it.
[[example]]
name = "frame_png"
path = "examples/frame_png/main.rs"
required-features = ["png-capture"]

# Round 2's frames, driven from the pantry group so the PNG and the grid dump cannot come
# from two different renders. Needs both features: the capture backend AND the ingredient
# list it reads its frames from.
[[example]]
name = "mf_frames"
path = "examples/mf_frames/main.rs"
required-features = ["png-capture", "tui-pantry"]
